<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>browsercli — Form</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
</head>
<body class="min-h-screen bg-gray-50 text-gray-900">
  <header class="bg-white shadow-sm">
    <div class="mx-auto max-w-2xl px-4 py-6">
      <h1 class="text-2xl font-bold tracking-tight">Interactive Form</h1>
      <p class="mt-1 text-sm text-gray-500">Tailwind CSS v4 + Alpine.js — client-side validation included.</p>
    </div>
  </header>

  <main class="mx-auto max-w-2xl px-4 py-10">
    <form
      x-data="{
        name: '',
        email: '',
        role: '',
        message: '',
        agreed: false,
        submitted: false,
        errors: {},
        validate() {
          this.errors = {};
          if (!this.name.trim()) this.errors.name = 'Name is required';
          if (!this.email.trim()) this.errors.email = 'Email is required';
          else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(this.email)) this.errors.email = 'Invalid email format';
          if (!this.role) this.errors.role = 'Please select a role';
          if (!this.agreed) this.errors.agreed = 'You must agree to continue';
          return Object.keys(this.errors).length === 0;
        },
        submit() {
          if (this.validate()) {
            this.submitted = true;
          }
        },
        reset() {
          this.name = '';
          this.email = '';
          this.role = '';
          this.message = '';
          this.agreed = false;
          this.submitted = false;
          this.errors = {};
        }
      }"
      @submit.prevent="submit()"
      class="rounded-xl bg-white p-8 shadow space-y-6"
    >
      <!-- Success message -->
      <div x-show="submitted" x-cloak class="rounded-lg bg-green-50 border border-green-200 p-4">
        <p class="text-sm font-medium text-green-800">Form submitted successfully!</p>
        <p class="mt-1 text-xs text-green-600">Name: <span x-text="name"></span> | Email: <span x-text="email"></span></p>
        <button type="button" @click="reset()" class="mt-2 text-xs text-green-700 underline">Reset form</button>
      </div>

      <div x-show="!submitted">
        <!-- Name -->
        <div>
          <label for="name" class="block text-sm font-medium text-gray-700">Name</label>
          <input
            id="name"
            type="text"
            x-model="name"
            class="mt-1 block w-full rounded-lg border border-gray-300 px-3 py-2 text-sm shadow-sm focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
            placeholder="Your name"
          >
          <p x-show="errors.name" x-text="errors.name" class="mt-1 text-xs text-red-600"></p>
        </div>

        <!-- Email -->
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
          <input
            id="email"
            type="email"
            x-model="email"
            class="mt-1 block w-full rounded-lg border border-gray-300 px-3 py-2 text-sm shadow-sm focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
            placeholder="you@example.com"
          >
          <p x-show="errors.email" x-text="errors.email" class="mt-1 text-xs text-red-600"></p>
        </div>

        <!-- Role select -->
        <div>
          <label for="role" class="block text-sm font-medium text-gray-700">Role</label>
          <select
            id="role"
            x-model="role"
            class="mt-1 block w-full rounded-lg border border-gray-300 px-3 py-2 text-sm shadow-sm focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
          >
            <option value="">Select a role...</option>
            <option value="developer">Developer</option>
            <option value="designer">Designer</option>
            <option value="manager">Manager</option>
            <option value="other">Other</option>
          </select>
          <p x-show="errors.role" x-text="errors.role" class="mt-1 text-xs text-red-600"></p>
        </div>

        <!-- Message textarea -->
        <div>
          <label for="message" class="block text-sm font-medium text-gray-700">Message <span class="text-gray-400">(optional)</span></label>
          <textarea
            id="message"
            x-model="message"
            rows="4"
            class="mt-1 block w-full rounded-lg border border-gray-300 px-3 py-2 text-sm shadow-sm focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
            placeholder="Tell us more..."
          ></textarea>
        </div>

        <!-- Checkbox -->
        <div class="flex items-start gap-2">
          <input
            id="agreed"
            type="checkbox"
            x-model="agreed"
            class="mt-0.5 h-4 w-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500"
          >
          <label for="agreed" class="text-sm text-gray-600">I agree to the terms and conditions</label>
        </div>
        <p x-show="errors.agreed" x-text="errors.agreed" class="text-xs text-red-600 -mt-4"></p>

        <!-- Submit -->
        <button
          type="submit"
          class="w-full rounded-lg bg-blue-600 px-4 py-2.5 text-sm font-semibold text-white shadow hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
        >
          Submit
        </button>
      </div>
    </form>
  </main>

  <footer class="mt-16 border-t border-gray-200 py-6 text-center text-xs text-gray-400">
    Powered by <a href="https://github.com/justinhuangcode/browsercli" class="underline">browsercli</a>
  </footer>
</body>
</html>
