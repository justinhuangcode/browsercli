name: Fix npm latest tag

on:
  workflow_dispatch:

jobs:
  fix-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm dist-tag add @justinhuangcode/browsercli@1.0.2 latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
