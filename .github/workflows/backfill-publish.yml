name: Backfill Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to publish (e.g. v1.0.0)'
        required: true
        type: string
      publish_crate:
        description: 'Publish to crates.io'
        required: false
        type: boolean
        default: false
      publish_npm:
        description: 'Publish to npm'
        required: false
        type: boolean
        default: false
      publish_pypi:
        description: 'Publish to PyPI'
        required: false
        type: boolean
        default: false

jobs:
  publish-crate:
    name: Publish crates.io
    if: inputs.publish_crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-npm:
    name: Publish npm
    if: inputs.publish_npm
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/node
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Patch package name to scoped name if needed
      - name: Patch package.json to scoped name
        run: |
          node -e "
            const pkg = require('./package.json');
            if (pkg.name === 'browsercli') {
              pkg.name = '@justinhuangcode/browsercli';
              require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
              console.log('Patched name to @justinhuangcode/browsercli');
            } else {
              console.log('Name already scoped: ' + pkg.name);
            }
          "

      - run: npm ci
      - run: npm run build
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-pypi:
    name: Publish PyPI
    if: inputs.publish_pypi
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/python
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - run: twine upload --skip-existing dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
