name: Fix GitHub Packages latest

on:
  workflow_dispatch:

jobs:
  fix-tag:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
      - run: npm dist-tag add @justinhuangcode/browsercli@1.0.3 latest --registry https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
