[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "browsercli"
version = "1.0.1"
description = "Python client for the browsercli browser workspace daemon"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
keywords = ["browser", "automation", "rpc", "cdp", "devtools"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/justinhuangcode/browsercli"
Repository = "https://github.com/justinhuangcode/browsercli"
Documentation = "https://github.com/justinhuangcode/browsercli#readme"
"Bug Reports" = "https://github.com/justinhuangcode/browsercli/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
